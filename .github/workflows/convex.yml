name: Deploy Convex
on:
  push:
    branches: [main]
    paths: ['convex/**', '.github/workflows/convex.yml', 'scripts/migrate.mjs']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PARENT_CODE: ${{ secrets.PARENT_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Push functions
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then echo "::error::CONVEX_DEPLOY_KEY secret is missing"; exit 1; fi
          npx convex deploy --typecheck disable -y > /tmp/o.txt 2>&1 || { echo "::error::$(tail -c 900 /tmp/o.txt | tr '\n' ' ')"; exit 1; }
      - name: Set codes
        run: |
          if [ -z "$PARENT_CODE" ]; then echo "::error::PARENT_CODE secret is missing"; exit 1; fi
          W=$(grep -o "code: '[^']*'" jehad/sync-config.js | cut -d"'" -f2)
          npx convex env set WRITE_CODE "$W" > /tmp/o.txt 2>&1 || { echo "::error::$(tail -c 600 /tmp/o.txt | tr '\n' ' ')"; exit 1; }
          npx convex env set PARENT_CODE "$PARENT_CODE" > /tmp/o.txt 2>&1 || { echo "::error::$(tail -c 600 /tmp/o.txt | tr '\n' ' ')"; exit 1; }
      - name: Import Jehad history (safe to repeat)
        run: |
          node scripts/migrate.mjs > /tmp/m.json
          npx convex run migrate:importSessions "$(cat /tmp/m.json)" > /tmp/o.txt 2>&1 || { echo "::error::$(tail -c 600 /tmp/o.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice::imported $(tail -c 50 /tmp/o.txt)"
