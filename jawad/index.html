<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>سجل التقييم الأساسي</title>
<style>
body{margin:0}
[hidden]{display:none!important}
.bl .group.skipped,.bl .item.skipped{opacity:.5}
.bl .group.skipped h3,.bl .item.skipped .stim{text-decoration:line-through}
.bl .group.skipped .fields,.bl .item.skipped .fields{pointer-events:none}
.bl .skipnote{padding:8px 16px;font-size:13px;font-weight:600;color:var(--no);background:var(--no-tint);border-bottom:1px solid var(--line)}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap');

/* Layout: one working column — sticky status bar, section chips, one section at a time; item rows built for thumbs on a tablet beside the child */
.bl{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#e9edeb; --ink:#16262a; --muted:#5b6b6e; --line:#d4dbd9;
  --accent:#0f5b62; --accent-ink:#ffffff; --accent-tint:#dcebec;
  --ok:#2c7a4c; --ok-tint:#ddf0e3; --no:#a2392b; --no-tint:#f6e0dc; --part:#8a5a00; --part-tint:#fbefd2;
  --probe:#5b4a8a; --probe-tint:#ebe7f5;
  --f-body:'IBM Plex Sans Arabic','Geeza Pro','Noto Sans Arabic',Tahoma,sans-serif;
  --f-stim:'Amiri','Traditional Arabic','Geeza Pro',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bl{
  --bg:#0f1719; --surface:#162124; --sunk:#1c292d; --ink:#e3ebea; --muted:#9aabad; --line:#2a3a3e;
  --accent:#62b4bb; --accent-ink:#0b1416; --accent-tint:#1c393c;
  --ok:#6cc391; --ok-tint:#173225; --no:#ef8a7a; --no-tint:#3a1f1b; --part:#e8b955; --part-tint:#3a2e12;
  --probe:#aa9be0; --probe-tint:#262040; color-scheme:dark }}
:root[data-theme="dark"] .bl{
  --bg:#0f1719; --surface:#162124; --sunk:#1c292d; --ink:#e3ebea; --muted:#9aabad; --line:#2a3a3e;
  --accent:#62b4bb; --accent-ink:#0b1416; --accent-tint:#1c393c;
  --ok:#6cc391; --ok-tint:#173225; --no:#ef8a7a; --no-tint:#3a1f1b; --part:#e8b955; --part-tint:#3a2e12;
  --probe:#aa9be0; --probe-tint:#262040; color-scheme:dark }
.bl *{box-sizing:border-box}
.bl{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;margin:0}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 80px}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 8px}
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:17px;font-weight:700;flex:1 1 auto;min-width:0}
.pill{font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.busy{background:var(--accent-tint);color:var(--accent)}
.pill.err{background:var(--no-tint);color:var(--no)}
.sess-chip{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.sess-chip.none{border-color:var(--no);color:var(--no)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.tabs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button[aria-current="true"] .cnt{color:var(--accent-ink);opacity:.8}
nav.tabs button.probe-tab{border-color:var(--probe)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:13.5px;background:var(--part-tint);color:var(--ink)}
.banner b{color:var(--part)}
main{padding-top:14px}
.sec-head{margin:6px 0 14px}
.sec-head h2{font-size:21px}
.eyebrow{font-size:12px;letter-spacing:.02em;color:var(--accent);font-weight:600}
.eyebrow.probe{color:var(--probe)}
.lead{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:65ch}
.note{background:var(--accent-tint);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
.note b{color:var(--accent)}
.note.warn{background:var(--no-tint)} .note.warn b{color:var(--no)}
.note.gold{background:var(--part-tint)} .note.gold b{color:var(--part)}
.note.probe{background:var(--probe-tint)} .note.probe b{color:var(--probe)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.group > header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group > header h3{font-size:15.5px;flex:1 1 auto}
.group > header .gscore{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.group .how{padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--sunk)}
.item{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
@media (max-width:560px){.item{grid-template-columns:1fr}}
.stimbox{min-width:0;display:flex;flex-direction:column;gap:2px}
.stim{font-family:var(--f-stim);font-size:23px;line-height:1.5;color:var(--ink)}
.stim.small{font-family:var(--f-body);font-size:14.5px;font-weight:600;line-height:1.6}
.key{font-size:12px;color:var(--muted)}
.showbtn{align-self:flex-start;margin-top:4px;font-size:12px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:2px 9px;cursor:pointer;color:var(--accent)}
.fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg-l{font-size:12px;color:var(--muted);margin-inline-end:2px}
.seg button{min-height:40px;min-width:52px;padding:4px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{font-weight:700}
.seg button.v-ok[aria-pressed="true"]{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.seg button.v-no[aria-pressed="true"]{background:var(--no-tint);border-color:var(--no);color:var(--no)}
.seg button.v-part[aria-pressed="true"],.seg button.v-other[aria-pressed="true"]{background:var(--part-tint);border-color:var(--part);color:var(--part)}
.seg button.v-na[aria-pressed="true"]{background:var(--sunk);border-color:var(--muted);color:var(--muted)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
input.tx,textarea.tx{width:100%;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 11px;font-size:14px}
textarea.tx{min-height:76px;resize:vertical}
input.tx:disabled{opacity:.45}
label.num{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
label.num input{width:80px;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.codes{display:flex;gap:5px;flex-wrap:wrap}
.codes .cl{font-size:12px;color:var(--muted);width:100%}
.codes button{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:32px}
.codes button[aria-pressed="true"]{background:var(--no-tint);border-color:var(--no);color:var(--no);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.passage{font-family:var(--f-stim);font-size:20px;line-height:2.1;padding:14px 16px;border-bottom:1px solid var(--line)}
.btn{min-height:42px;padding:6px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.probe{background:var(--probe);border-color:var(--probe);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* sessions */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.sess.current{border:2px solid var(--accent)}
.sess .full{grid-column:1/-1}
.sess label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.sess .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sess .head b{font-size:15px;color:var(--ink)}
/* probe */
.probe-switch{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.probe-switch button{border:1px solid var(--probe);background:transparent;color:var(--probe);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:600}
.probe-switch button[aria-pressed="true"]{background:var(--probe);color:var(--accent-ink)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.stage.primary{border:2px solid var(--part)}
.stage > header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.stage > header h3{font-size:15.5px;flex:1 1 auto}
.stage .tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--part-tint);color:var(--part);font-weight:600}
.stage .tag.grey{background:var(--sunk);color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:8px 14px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start}
.trow:last-child{border-bottom:0}
@media (max-width:560px){.trow{grid-template-columns:1fr}}
.tname{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.tname .n{color:var(--probe);font-variant-numeric:tabular-nums;margin-inline-end:4px}
table.ref{width:100%;border-collapse:collapse;font-size:13px}
table.ref th,table.ref td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:right;vertical-align:top}
table.ref th{color:var(--muted);font-weight:600;background:var(--sunk)}
.tablewrap{overflow-x:auto}
/* summary */
.sumtable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumtable th,.sumtable td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.sumtable th{background:var(--sunk);color:var(--muted);font-weight:600}
.sumtable td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtable tr.sec td{background:var(--accent-tint);font-weight:700}
pre.out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--f-body);font-size:13px;max-height:340px;overflow:auto}
/* child view */
#stage{position:fixed;inset:0;z-index:100;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer}
#stage .big{font-family:var(--f-stim);font-size:clamp(64px,16vw,150px);line-height:1.5;color:var(--ink);text-align:center}
#stage .big.text{font-size:clamp(24px,4.6vw,38px);line-height:2.2;max-width:34ch;text-align:right}
#stage .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:12px;font-size:13px;background:var(--sunk);border:0;border-radius:999px;padding:6px 14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .seg button,.codes button{transition:background .12s,border-color .12s} }

.bl .guide-btn{margin-inline-start:auto;font-size:13px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.bl .guide-btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.bl .guide{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px 18px;margin:10px 0 16px;font-size:14px;line-height:1.85}
.bl .guide p{margin:6px 0}
.bl .guide ol,.bl .guide ul{margin:4px 0;padding-inline-start:22px}
.bl dl.gd{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
.bl dl.gd dt{font-weight:700;color:var(--accent)}
.bl dl.gd dd{margin:0}
.bl dl.gd dd.say{background:var(--accent-tint);border-radius:8px;padding:6px 10px}
.bl dl.gd dd.ex{background:var(--part-tint);border-radius:8px;padding:6px 10px}
@media (max-width:560px){.bl dl.gd{grid-template-columns:1fr}.bl dl.gd dt{margin-top:6px}}
.bl table.gt{width:100%;border-collapse:collapse;margin:8px 0}
.bl table.gt th,.bl table.gt td{border:1px solid var(--line);padding:6px 10px;text-align:right}
.bl table.gt th{background:var(--sunk)}
.bl .sec-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

</style>
</head>
<body>
<div id="app" class="bl" dir="rtl" lang="ar"></div>
<script src="https://cdn.jsdelivr.net/npm/convex@1.42.2/dist/browser.bundle.js"></script>
<script>
const block = (g) => `
<dl class="gd">
  <dt>الهدف</dt><dd>${g.goal}</dd>
  <dt>تحتاج قبل البدء</dt><dd>${g.prep}</dd>
  <dt>تقول له حرفيًا</dt><dd class="say">${g.say}</dd>
  <dt>كيف تعرض السؤال</dt><dd>${g.present}</dd>
  <dt>لا تفعل</dt><dd><ul>${g.dont.map((d) => `<li>${d}</li>`).join('')}</ul></dd>
  <dt>كيف تسجّل</dt><dd>${g.record}</dd>
  <dt>متى توقف</dt><dd>${g.stop}</dd>
  <dt>مثال</dt><dd class="ex">${g.example}</dd>
  <dt>أخطاء يقع فيها الأهل كثيرًا</dt><dd><ul>${g.mistakes.map((d) => `<li>${d}</li>`).join('')}</ul></dd>
</dl>`

const COMMON_DONT = ['لا تعلّمه الجواب ولا تلمّح له', 'لا تقل «ركّز» أو «أنت تعرفها»', 'لا تُظهر خيبة أمل، وامدح المحاولة لا الجواب الصحيح فقط']

const GUIDE = {
  sessions: `
<p><b>الفرق الأهم:</b> الأقسام أ–ح «قياس»: نرى ما يعرفه الآن بدون أي تعليم. القسم ط فقط فيه «تعليم» متعمد. إذا علّمته أثناء القياس، تصير النتيجة أعلى من الواقع ولا نعرف مستواه الحقيقي.</p>
<table class="gt"><tr><th>أثناء القياس (أ–ح)</th><th>أثناء التعليم (ط فقط)</th></tr>
<tr><td>لا أعلّم الجواب</td><td>أشرح الجواب</td></tr>
<tr><td>لا أصحّح مباشرة</td><td>أصحّح وأدرّب</td></tr>
<tr><td>أقيس ما يعرفه الآن</td><td>أحاول أن يتعلم</td></tr>
<tr><td>لا تلميح إلا إذا سمحت المهمة</td><td>مساعدة متدرجة</td></tr></table>
<p><b>كل مرة:</b> اضغطي «ابدأ جلسة جديدة» قبل أول سؤال، وفي آخر الجلسة عبّئي النوم والمزاج والملاحظات. الجلسة ١٥–٢٥ دقيقة، وأوقفيها عند التعب أو الإحباط.</p>
<p><b>جملة البداية:</b> «الحين بنسوي كم نشاط بسيط، مو اختبار مدرسة، وما فيه نجاح ورسوب. إذا ما عرفت عادي، قل ما أدري».</p>`,

  A: block({
    goal: 'هل يسمع أصوات الكلام ويقسّمها ويدمجها؟ هذا مختلف عن معرفة الحروف المكتوبة.',
    prep: 'مكان هادئ بلا تلفزيون أو جوال. لا تحتاج ورقًا، القسم كله شفهي.',
    say: '«بنلعب لعبة بالكلام. أنا أقول كلمة وأنت تقول لي شي عنها. إذا ما عرفت عادي».',
    present: 'تقولين الكلمة بصوتك ولا تعرضين شيئًا مكتوبًا. بالفصحى الواضحة. تعيدين الكلمة مرتين كحد أقصى إن طلب. قبل كل مهمة مثال تدريبي واحد لا يُحسب، وتشرحين فيه المطلوب حتى يفهم.',
    dont: COMMON_DONT.concat(['في الدمج: لا تنطقي الحرف بفتحة. قولي «ك… وووو… ب» لا «كا… وو… با»']),
    record: 'اكتبي ما قاله بالضبط، لا «غلط». مثال: «قال ش بدل س»، أو «قال صوت الحرف بفتحة: مَ».',
    stop: 'بعد ٣ أخطاء متتالية في نفس المهمة انتقلي للتي بعدها. التجزئة والحذف فقط إذا نجح في الدمج.',
    example: 'تقولين: «سيارة… أي صوت تسمعه أول الكلمة؟». يقول: «ش». تضغطين ✗ وتكتبين: ش.',
    mistakes: ['تكرار الكلمة أكثر من مرتين لأنك تبينه يجاوب صح', 'تغيير الكلمة إذا بدت صعبة بدون تسجيل ذلك', 'تعبير الوجه يكشف إن كان جوابه صحيحًا'],
  }),

  B: block({
    goal: 'كم حرفًا يعرف اسمه، وكم حرفًا يعرف صوته. الاثنان منفصلان.',
    prep: 'الجوال أو الآيباد. زر «اعرض للطفل» يكبّر الحرف على الشاشة بدون الإجابة.',
    say: '«بشوف معك الحروف وحدة وحدة».',
    present: 'اعرضي الحرف وحده. اسألي: «وش اسم هذا الحرف؟» وسجّلي. ثم: «طيب وش صوته؟» وسجّلي. لا تسألي السؤالين معًا.',
    dont: COMMON_DONT.concat(['لا تعرضي الحرف داخل كلمة في المهمة الأولى']),
    record: 'الاسم ✓ أو ✗، والصوت ✓ أو ✗، كلٌّ وحده. إذا قال صوت الحرف بفتحة («با») فالصوت صحيح، واكتبي ما قاله.',
    stop: 'إذا تعب في منتصف الحروف، توقفي وأكملي في جلسة أخرى.',
    example: 'حرف «ذ»: للاسم قال «ذا» ← الاسم ✗ واكتبي «ذا». للصوت قال «ذا» ← الصوت ✓.',
    mistakes: ['ترك الحرف أمامه وقتًا طويلًا جدًا كأنك تنتظرين أن يتذكر', 'نسيان سؤال الصوت بعد الاسم'],
  }),

  C: block({
    goal: 'أين بالضبط يستطيع القراءة وأين يتوقف، من أبسط مقطع إلى الكلمات الطويلة، ثم كلمات غير حقيقية لنرى هل يقرأ بالحروف فعلًا أم يحفظ الشكل.',
    prep: 'الجوال أو الآيباد مع زر «اعرض للطفل».',
    say: '«هذي كلمات، بعضها سهلة وبعضها أصعب، وبعضها مو حقيقية أصلًا. اقرأها بصوت عالي على راحتك».',

/* ============ STATE ============ */
const store = {};               // path -> doc object
const dirty = new Set();        // paths with unsaved local edits
let db = null, dbMode = 'pending';
let tab = 'sessions', probeId = 'A';
let currentSid = null;
const LS_KEY = 'baseline-v22-fallback';
try { currentSid = localStorage.getItem('bl-sid') || null; tab = localStorage.getItem('bl-tab') || 'sessions'; } catch(e) {}

const get = p => store[p] || (store[p] = {});
function deepGet(o, kp){ return kp.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function deepSet(o, kp, v){
  const ks = kp.split('.'); let cur = o;
  for(let i = 0; i < ks.length - 1; i++){
    const k = ks[i], nk = ks[i+1];
    if(cur[k] == null) cur[k] = /^\d+$/.test(nk) ? [] : {};
    cur = cur[k];
  }
  cur[ks[ks.length-1]] = v;
}

/* ============ SAVING ============ */
const saver = { timers:{}, busy:{}, again:{} };
function setStatus(){
  const el = $('#saveState');
  if(dbMode === 'pending'){ el.className = 'pill'; el.textContent = 'جارٍ الاتصال…'; return; }
  if(dbMode === 'local'){ el.className = 'pill err'; el.textContent = 'حفظ على هذا الجهاز فقط'; return; }
  if(dbMode === 'error'){ el.className = 'pill err'; el.textContent = 'تعذّر الحفظ — تحقق من الاتصال'; return; }
  if(dirty.size){ el.className = 'pill busy'; el.textContent = 'يحفظ…'; return; }
  el.className = 'pill ok'; el.textContent = 'محفوظ ✓';
}
function queueSave(path){
  dirty.add(path); setStatus();
  clearTimeout(saver.timers[path]);
  saver.timers[path] = setTimeout(() => { saver.timers[path] = null; flush(path); }, 600);
}
async function flush(path){
  if(saver.busy[path]){ saver.again[path] = true; return; }
  saver.busy[path] = true;
  const body = JSON.parse(JSON.stringify(get(path)));
  try{
    if(db){ await db.doc(path).set(body); if(dbMode === 'error') dbMode = 'live'; }
    else saveLocal();
  }catch(e){
    if(e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 800 + Math.random()*800)); try{ await db.doc(path).set(body); }catch(e2){ dbMode = 'error'; } }
    else dbMode = 'error';
  }
  saver.busy[path] = false;
  if(saver.again[path]){ saver.again[path] = false; return flush(path); }
  if(!saver.timers[path] && dbMode !== 'error') dirty.delete(path);
  setStatus();

function fieldHTML(path, f, extraAttr){

  if(f.t === 'text') return `<input class="tx" type="text" id="${fid}" data-doc="${path}" data-k="${f.k}" placeholder="${esc(f.ph || '')}" autocomplete="off" ${extraAttr||''}>`;

  if(f.t === 'num') return `<label class="num"><input type="number" inputmode="numeric" min="0" ${f.max != null ? `max="${f.max}"` : ''} id="${fid}" data-doc="${path}" data-k="${f.k}" ${extraAttr||''}> ${esc(f.suffix || '')}</label>`;

/* sync every bound control for one doc path */
function syncPath(path){
  const o = store[path] || {};
  document.querySelectorAll(`[data-doc="${path}"]`).forEach(el => {
    const k = el.dataset.k, v = deepGet(o, k);
    if(el.classList.contains('seg')){
      el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    } else if(el.dataset.codes){
      const arr = Array.isArray(v) ? v : [];
      el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(arr.includes(b.dataset.c))));
      const hasMark = !!el.closest('.item') && !!el.closest('.item').querySelector('.seg[data-k="mark"]');
      el.hidden = hasMark ? !(deepGet(o, 'mark') === 'no' || arr.length) : false;
    } else if(el.matches('input,textarea')){
      if(document.activeElement !== el) el.value = v == null ? '' : v;
    }
  });
  if(path.startsWith('probes/')) syncProbe();
  if(path.startsWith('sessions/')) renderSessChip();
}
function syncAll(){ Object.keys(store).forEach(syncPath); document.querySelectorAll('[data-doc]').forEach(el => { if(!store[el.dataset.doc]) syncPath(el.dataset.doc); }); }

/* ============ COUNTS ============ */
function itemFilled(id){
  const o = store['responses/' + id]; if(!o) return false;
  return ['mark','name','sound','n','v','lang','said'].some(k => o[k] != null && o[k] !== '');
}
function sectionCount(sec){
  let done = 0, total = 0;
  sec.groups.forEach(g => { if(g.skip) return; g.items.forEach(it => { if(it.skip) return; total++; if(itemFilled(it.id)) done++; }); });
  return [done, total];
}
function groupScore(g){
  const marks = g.items.map(it => (store['responses/' + it.id] || {}));
  const hasMark = (g.fields || []).some(f => f.k === 'mark') || g.items.some(it => (it.fields || []).some(f => f.k === 'mark'));
  if(g.id === 'B1'){
    const nm = marks.filter(r => r.name === 'ok').length, sd = marks.filter(r => r.sound === 'ok').length;
    const nT = marks.filter(r => r.name).length, sT = marks.filter(r => r.sound).length;
    return `الأسماء ${ar(nm)} من ${ar(nT)} مُختبَر · الأصوات ${ar(sd)} من ${ar(sT)} مُختبَر · (من ٢٨)`;
  }
  if(hasMark){
    const ok = marks.filter(r => r.mark === 'ok').length;
    const applied = marks.filter(r => r.mark && r.mark !== 'na').length;
    return `${ar(ok)} صحيح من ${ar(applied)} مُطبَّق (من ${ar(g.items.length)})`;
  }
  return '';
}
function updateCounts(){

    const el = document.querySelector(`#tabs [data-tab="${sec.id}"] .cnt`);
    if(el){ const [d,t] = sectionCount(sec); el.textContent = `${ar(d)}/${ar(t)}`; }
  });
  document.querySelectorAll('[data-gscore]').forEach(el => {
    const g = findGroup(el.dataset.gscore); if(g) el.textContent = groupScore(g);
  });

}
function findGroup(id){ for(const s of SECTIONS) for(const g of s.groups) if(g.id === id) return g; return null; }
function gateText(){
  let ok = 0, ap = 0;
  ['C1','C2','C3','C4'].forEach(gid => findGroup(gid).items.forEach(it => { const r = store['responses/' + it.id] || {}; if(r.mark && r.mark !== 'na'){ ap++; if(r.mark === 'ok') ok++; } }));
  const p1 = (store['responses/F1-acc'] || {}).n;
  const pct = ap ? Math.round(ok / ap * 100) : null;
  return `<b>نتيجة مراحل فك الرموز ١–٤ حتى الآن:</b> ${ap ? `${ar(ok)} من ${ar(ap)} (${ar(pct)}٪)` : 'لم تُسجَّل بعد'}${p1 != null && p1 !== '' ? ` · <b>دقة الفقرة ١:</b> ${ar(p1)} من ٢٠ (${ar(Math.round(p1/20*100))}٪)` : ''}`;
}

function renderSessions(){
  let h = `<div class="sec-head"><div class="eyebrow">ابدأ من هنا في كل مرة</div><h2>الجلسات</h2>
    <p class="lead">ابدأ جلسة قبل أن تسجّل. كل إجابة تُربط بالجلسة الحالية وتُحفظ تلقائيًا، وأستطيع قراءتها من محادثتنا مباشرة. في آخر الجلسة عبّئ الملاحظات أدناه.</p></div>
    <div class="note"><b>الخطة:</b> ١) أ + ب · ٢) ج + د · ٣) هـ + و (إن سمح الشرط) · ٤) ح + ز · ٥) المسبار أ: التعليم · بعد ٢٤ ساعة: المسبار أ القياس الرئيسي. كل جلسة ١٥–٢٥ دقيقة.</div>
    <div class="row" style="margin:10px 0"><button type="button" class="btn" data-newsess="1">+ ابدأ جلسة جديدة</button></div>`;
  const list = sessions();
  if(!list.length) h += `<div class="note gold"><b>لا توجد جلسات بعد.</b> اضغط «ابدأ جلسة جديدة» قبل أول سؤال.</div>`;
  list.forEach(([p, o]) => {
    const sid = p.split('/')[1], cur = sid === currentSid;
    h += `<div class="sess ${cur ? 'current' : ''}"><div class="head"><b>${esc(sessLabel(o))}</b>${cur ? '<span class="pill ok">الجلسة الحالية</span>' : `<button type="button" class="btn ghost" data-usesess="${sid}">اجعلها الحالية</button>`}</div>
      <label class="fl">التاريخ${fieldHTML(p, {k:'date', t:'date'})}</label>
      <label class="fl">الوقت${fieldHTML(p, {k:'time', t:'time'})}</label>
      <label class="fl">المدة بالدقائق${fieldHTML(p, {k:'dur', t:'text', ph:'مثال: ٢٠'})}</label>
      <label class="fl">الأقسام المطبّقة${fieldHTML(p, {k:'secs', t:'text', ph:'مثال: أ + ب'})}</label>
      <label class="fl">النوم الليلة السابقة${fieldHTML(p, {k:'sleep', t:'text', ph:'تقريبًا، وهل شخر أو استيقظ'})}</label>
      <label class="fl">مشتتات${fieldHTML(p, {k:'distr', t:'text', ph:'تلفزيون، ضيوف، جوال…'})}</label>
      <div class="full">${fieldHTML(p, {k:'mood', t:'seg', label:'مزاجه قبل الجلسة', o:MOOD})}</div>
      <label class="fl full">ملاحظات غير متوقعة${fieldHTML(p, {k:'notes', t:'area', ph:'أي شيء لافت حدث، حتى لو لم تعرف معناه'})}</label>
      <label class="fl full">أهم شيء لاحظته كأخ${fieldHTML(p, {k:'bro', t:'area', ph:'انطباعك بكلماتك'})}</label></div>`;
  });
  return h;
}
function newSession(){
  const sid = 's' + Date.now().toString(36);
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  store['sessions/' + sid] = { created: Date.now(), date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
  currentSid = sid; try{ localStorage.setItem('bl-sid', sid); }catch(e){}
  queueSave('sessions/' + sid);
  render(); renderSessChip();
}

/* ============ SUMMARY VIEW ============ */
function codeStr(r){ return Array.isArray(r.codes) && r.codes.length ? ` [${r.codes.join('، ')}]` : ''; }
function summaryText(){
  const L = [];
  L.push('ملخص سجل التقييم الأساسي — نسخة ٢.٢');
  sessions().slice().reverse().forEach(([p, o], i) => {
    L.push(`\n## الجلسة ${i+1}: ${sessLabel(o)}`);
    if(o.time) L.push(`الوقت: ${o.time}`); if(o.dur) L.push(`المدة: ${o.dur} دقيقة`);
    if(o.sleep) L.push(`النوم: ${o.sleep}`); if(o.mood) L.push(`المزاج: ${(MOOD.find(m => m.v === o.mood) || {}).l}`);
    if(o.distr) L.push(`مشتتات: ${o.distr}`); if(o.notes) L.push(`ملاحظات غير متوقعة: ${o.notes}`); if(o.bro) L.push(`أهم شيء لاحظته كأخ: ${o.bro}`);
  });
  SECTIONS.forEach(sec => {
    const lines = [];
    sec.groups.forEach(g => {
      const rows = g.items.map(it => [it, store['responses/' + it.id] || {}]).filter(([, r]) => Object.keys(r).some(k => k !== 'at' && k !== 'sid'));
      if(!rows.length) return;
      lines.push(`- ${g.title}: ${groupScore(g)}`);
      rows.forEach(([it, r]) => {
        const bits = [];
        if(r.mark && r.mark !== 'ok') bits.push(r.mark === 'no' ? 'خطأ' : r.mark === 'na' ? 'لم يُطبَّق' : r.mark === 'part' ? 'جزئيًا' : r.mark);
        if(g.id === 'B1'){ if(r.name === 'no') bits.push('الاسم خطأ'); if(r.sound === 'no') bits.push('الصوت خطأ'); }
        if(r.n != null && r.n !== '') bits.push(`${r.n}`);
        if(r.v) bits.push(r.v === 'ok' ? 'نعم/سهل' : r.v === 'part' ? 'متوسط/جزئيًا' : 'لا/متعب');
        ['lang','op','calc'].forEach(k => { if(r[k]) bits.push(`${k === 'lang' ? 'فهم الصياغة' : k === 'op' ? 'العملية' : 'الحساب'}: ${r[k] === 'ok' ? 'نعم' : 'لا'}`); });
        if(r.strat) bits.push(`الطريقة: ${({fing:'أصابع',on:'عدّ تصاعدي',mind:'ذهني',paper:'كتابة',guess:'تخمين'})[r.strat]}`);
        if(r.speed) bits.push(r.speed === 'ok' ? 'سريع' : 'بطيء');
        if(r.said) bits.push(`قال/كتب: «${r.said}»`);
        if(bits.length || codeStr(r)) lines.push(`   • ${it.stim}: ${bits.join(' · ')}${codeStr(r)}`);
      });
    });
    if(lines.length){ L.push(`\n## ${sec.tab}`); L.push(...lines); }
  });
  ['A','B'].forEach(pid => {
    const o = store['probes/' + pid]; if(!o || !Array.isArray(o.targets)) return;
    const f = filledTargets(o); if(!f.length) return;
    L.push(`\n## ${PROBES[pid].name}`);
    L.push('الهدف | قبل | محاولات | أول نجاح | معيار الجلسة | فوري | ٢٤ ساعة (مستقل) | ما قاله | أقل تلميح | ٧٢س مستقل/بتلميح');
    const m = v => v === 'ok' ? '✓' : v === 'no' ? '✗' : v === 'na' ? 'لم يستجب' : '—';
    f.forEach(([t]) => L.push(`${t.t} | ${t.pre === 'no' ? 'لا يعرفه' : t.pre === 'ok' ? 'يعرفه' : '—'} | ${t.trials || '—'} | ${t.first || '—'} | ${t.crit === 'ok' ? 'تحقق' : t.crit === 'no' ? 'لم يتحقق' : '—'} | ${m(t.imm)} | ${m(t.h24)} | ${t.h24said || '—'} | ${t.cueLvl || '—'}${t.cue ? ' («' + t.cue + '»)' : ''} | ${m(t.h72i)}/${m(t.h72c)}`));
    const h24 = f.filter(([t]) => t.h24 === 'ok').length;
    L.push(`المقياس الرئيسي بعد ٢٤ ساعة: ${h24} من ${f.length}`);
    if(o.genTotal) L.push(`التعميم: ${o.genOk || 0} من ${o.genTotal}${o.genItems ? ' (' + o.genItems + ')' : ''}`);
    if(o.notes) L.push(`ملاحظات: ${o.notes}`);
  });
  return L.join('\n');
}
function renderSummary(){
  let h = `<div class="sec-head"><div class="eyebrow">للقراءة فقط</div><h2>الملخص</h2><p class="lead">أرقام وصفية فقط: «X صحيح من Y». أستطيع قراءة كل التفاصيل من المحادثة مباشرة، والنص أدناه للنسخ إن احتجته.</p></div>`;
  h += `<table class="sumtable"><tr><th>المهمة</th><th>النتيجة</th></tr>`;
  SECTIONS.forEach(sec => {
    const [d, t] = sectionCount(sec);
    h += `<tr class="sec"><td>${esc(sec.tab)}</td><td class="n">${ar(d)} من ${ar(t)} مُسجَّل</td></tr>`;
    sec.groups.forEach(g => { const s = groupScore(g); if(s) h += `<tr><td>${esc(g.title)}</td><td class="n">${esc(s)}</td></tr>`; });
  });
  ['A','B'].forEach(pid => {
    const o = store['probes/' + pid]; const f = o && Array.isArray(o.targets) ? filledTargets(o) : [];
    h += `<tr class="sec"><td>${esc(PROBES[pid].name)}</td><td class="n">${f.length ? `بعد ٢٤ ساعة: ${ar(f.filter(([t]) => t.h24 === 'ok').length)} من ${ar(f.length)}` : 'لم يبدأ'}</td></tr>`;
  });
  h += `</table><div class="row" style="margin:14px 0 8px"><button type="button" class="btn" data-copy="1">انسخ الملخص نصًّا</button><span class="key" id="copyMsg"></span></div><pre class="out" id="sumOut">${esc(summaryText())}</pre>`;
  return h;
}

/* ============ MAIN RENDER ============ */
function render(){
  const m = $('#main');
  if(tab === 'sessions') m.innerHTML = renderSessions();
  else if(tab === 'I') m.innerHTML = renderProbe();
  else if(tab === 'sum') m.innerHTML = renderSummary();
  else { const sec = SECTIONS.find(s => s.id === tab) || SECTIONS[0]; m.innerHTML = renderSection(sec); }
  addGuide(m, tab);
  syncAll(); updateCounts(); syncProbe();
}
function addGuide(m, id){
  const head = m.querySelector('.sec-head'), h2 = head && head.querySelector('h2');
  if(!h2 || !GUIDE[id]) return;
  const row = document.createElement('div'); row.className = 'sec-title-row';
  h2.replaceWith(row); row.appendChild(h2);
  const b = document.createElement('button'); b.type = 'button'; b.className = 'guide-btn'; b.textContent = '👨‍🏫 للمعلّم'; b.setAttribute('aria-expanded', 'false');
  row.appendChild(b);
  const g = document.createElement('div'); g.className = 'guide'; g.hidden = true; g.innerHTML = GUIDE[id];
  head.after(g);
  b.addEventListener('click', () => { g.hidden = !g.hidden; b.setAttribute('aria-expanded', String(!g.hidden)); });
}

/* ============ EVENTS ============ */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });
$('#sessChip').addEventListener('click', () => go('sessions'));
$('#main').addEventListener('click', e => {
  const sb = e.target.closest('.seg button');
  if(sb && !sb.disabled){
    const seg = sb.closest('.seg'), path = seg.dataset.doc, k = seg.dataset.k;
    const cur = deepGet(store[path] || {}, k);
    setField(path, k, cur === sb.dataset.v ? null : sb.dataset.v);
    return;
  }
  const cb = e.target.closest('.codes button');
  if(cb){
    const box = cb.closest('.codes'), path = box.dataset.doc, k = box.dataset.k;
    const arr = (deepGet(store[path] || {}, k) || []).slice(), c = cb.dataset.c, i = arr.indexOf(c);
    if(i >= 0) arr.splice(i, 1); else arr.push(c);
    setField(path, k, arr); return;
  }
  const sh = e.target.closest('[data-show]');
  if(sh){ const t = $('#stageText'); t.textContent = sh.dataset.show; t.className = 'big' + (sh.dataset.long ? ' text' : ''); $('#stage').hidden = false; return; }
  if(e.target.closest('[data-newsess]')){ newSession(); return; }
  const us = e.target.closest('[data-usesess]');
  if(us){ currentSid = us.dataset.usesess; try{ localStorage.setItem('bl-sid', currentSid); }catch(e2){} render(); renderSessChip(); return; }
  const pb = e.target.closest('[data-probe]');
  if(pb){ probeId = pb.dataset.probe; render(); return; }
  const path = 'probes/' + probeId;
  if(e.target.closest('[data-addt]')){ const o = probeDoc(probeId); if(o.targets.length < 6){ o.targets.push({}); queueSave(path); render(); } return; }
  if(e.target.closest('[data-delt]')){ const o = probeDoc(probeId); if(o.targets.length > 4){ o.targets.pop(); queueSave(path); render(); } return; }
  if(e.target.closest('[data-teachat]')){ setField(path, 'teachAt', Date.now()); return; }
  if(e.target.closest('[data-copy]')){
    const txt = summaryText(), msg = $('#copyMsg');
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#sumOut')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'حدّدت النص — انسخه يدويًا'; };
    try{ navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'نُسخ ✓'; }, fallback); }catch(err){ fallback(); }
  }
});
$('#main').addEventListener('input', e => {
  const el = e.target; if(!el.dataset || !el.dataset.doc) return;
  setField(el.dataset.doc, el.dataset.k, el.value);
});
$('#stage').addEventListener('click', () => { $('#stage').hidden = true; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') $('#stage').hidden = true; });

/* ============ BOOT ============ */
renderTabs(); render(); renderSessChip(); setStatus();

(function connect(){
  db = { doc: p => ({ set: data => client.mutation(api.records.put, { path: p, data }) }) };
  dbMode = 'live'; setStatus();
  let first = true;
  client.onUpdate(api.records.all, {}, rows => {
    const seen = new Set();
    let probeLenChanged = false, newSess = false;
    rows.forEach(r => {
      seen.add(r.path);
      if(dirty.has(r.path)) return;
      if(r.path.startsWith('sessions/') && !store[r.path]) newSess = true;
      if(r.path === 'probes/' + probeId){ const a = (store[r.path] || {}).targets, b = (r.data || {}).targets; if(!a || !b || a.length !== b.length) probeLenChanged = true; }
      store[r.path] = JSON.parse(JSON.stringify(r.data || {}));
    });
    if(first || tab === 'sum' || (tab === 'sessions' && newSess) || (tab === 'I' && probeLenChanged)) render(); else syncAll();
    first = false;
    updateCounts(); renderSessChip(); setStatus();
  }, () => { dbMode = 'error'; setStatus(); });
})();
}

(function(){
  var client = new convex.ConvexClient("https://cheerful-civet-746.convex.cloud");
  start(document.getElementById('app'), client, convex.anyApi);
})();
</script>
